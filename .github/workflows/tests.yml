name: tests

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    env:
      MPLBACKEND: Agg
      SIRENOLITE_REQUIRE_GUI_TESTS: "1"
      SIRENOLITE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Use the runner's sandbox-configured Chrome
        id: chrome
        run: |
          echo "chrome-path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          google-chrome --version
      - name: Install test and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -e ".[test,docs]" build
      - name: Run behavior, physics, CLI, browser-core, and real Tk tests
        env:
          SIRENOLITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a python -m pytest
      - name: Build docs and distributable
        run: |
          mkdocs build --strict
          python -m build
      - name: Test installed wheel away from the source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_cli.py --output-dir build/installed-smoke
      - name: Test the extracted source distribution
        env:
          SIRENOLITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          source_archive_dir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$source_archive_dir"
          cd "$source_archive_dir"
          xvfb-run -a python -m pytest --no-cov
      - name: Retain coverage and installed-solve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            coverage.xml
            build/installed-smoke/
      - name: Retain Python distributions
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  paper-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install solver
        run: python -m pip install .
      - name: Reproduce representative annual paper cases
        run: python scripts/verify_gui_paper_cases.py --hourly --output-dir build/paper-replay
      - name: Retain annual comparison and hourly balances
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annual-paper-replay
          path: build/paper-replay/
          if-no-files-found: error

name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    env:
      MPLBACKEND: Agg
      SIRENOLITE_REQUIRE_GUI_TESTS: "1"
      SIRENOLITE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Install test and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -e ".[test,docs]" build
      - name: Run behavior, physics, CLI, browser-core, and real Tk tests
        env:
          SIRENOLITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a python -m pytest
      - name: Build docs and distributable
        run: |
          mkdocs build --strict
          python -m build
      - name: Test installed wheel away from the source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_cli.py --output-dir build/installed-smoke
      - name: Test the extracted source distribution
        env:
          SIRENOLITE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          source_archive_dir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$source_archive_dir"
          cd "$source_archive_dir"
          xvfb-run -a python -m pytest --no-cov
      - name: Retain coverage and installed-solve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            coverage.xml
            build/installed-smoke/

name: build-gui

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build_gui.yml"
      - "scripts/build_gui_*"
      - "scripts/prewarm_matplotlib_cache.py"
      - "sirenolite/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "GUI_BUILD.md"
  push:
    branches:
      - main
      - master
      - examples
    tags:
      - "v*"
    paths:
      - ".github/workflows/build_gui.yml"
      - "scripts/build_gui_*"
      - "scripts/prewarm_matplotlib_cache.py"
      - "sirenolite/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "GUI_BUILD.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      SIRENOLITE_REQUIRE_GUI_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install verification dependencies
        run: python -m pip install ".[test]"
      - name: Verify source behavior (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
      - name: Verify source behavior (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m pytest
      - name: Build GUI (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build_gui_linux.sh
      - name: Build GUI (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build_gui_mac.sh
      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build_gui_windows.ps1
      - name: Verify packaged Linux GUI and local solver
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/sirenolite_gui --smoke-test build/frozen-smoke
      - name: Verify packaged macOS GUI and local solver
        if: runner.os == 'macOS'
        run: dist/sirenolite_gui.app/Contents/MacOS/sirenolite_gui --smoke-test build/frozen-smoke
      - name: Verify packaged Windows GUI and local solver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/sirenolite_gui.exe -ArgumentList '--smoke-test', 'build/frozen-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path build/frozen-smoke/smoke_report.json)) { throw 'GUI smoke report missing' }
      - name: Retain packaged solve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-smoke-${{ matrix.platform }}
          path: build/frozen-smoke/
      - name: Package artifact (Linux/macOS)
        if: runner.os == 'Linux'
        run: zip -j "sirenolite_gui-${{ matrix.platform }}.zip" dist/sirenolite_gui
      - name: Package application (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/sirenolite_gui.app sirenolite_gui-macos.zip
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/sirenolite_gui.exe -DestinationPath "sirenolite_gui-${{ matrix.platform }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirenolite_gui-${{ matrix.platform }}
          path: sirenolite_gui-${{ matrix.platform }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/sirenolite_gui-*.zip
